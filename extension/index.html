<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="lkfb-version" content="0.6.9" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; img-src 'self' file: data: blob:; media-src 'self' file: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LK‘s File Bridge</title>
    <link rel="stylesheet" href="css/panel.css" />
    <link rel="stylesheet" href="css/ui-4.3.css" />
    <link rel="stylesheet" href="css/player-4.5.css" />
    <link rel="stylesheet" href="css/offline-preview.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <header class="topbar">
        <span id="hostLabel" class="sr-only">本地素材桥</span>
        <div class="utility-actions">
          <button id="locationsToolbarButton" class="utility-source-button" type="button" title="管理素材来源" data-hint="管理素材来源" aria-label="管理素材来源" aria-haspopup="true" aria-expanded="false"><span class="icon-folder" aria-hidden="true"></span></button>
        </div>
      </header>

      <section class="location-bar" aria-label="素材位置">
        <button id="upFolderButton" class="icon-button folder-up" type="button" title="返回上一级" aria-label="返回上一级" hidden><span class="icon-up" aria-hidden="true"></span></button>
        <button id="locationsButton" class="path-button" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="status-dot" id="mountStatus"></span>
          <span id="rootLabel" class="path-label">正在检查素材位置...</span>
          <span class="path-chevron">&#9662;</span>
        </button>
        <button id="refreshButton" class="icon-button location-refresh" type="button" title="刷新所有素材位置" data-hint="刷新素材位置" aria-label="刷新素材">&#8635;</button>
        <button id="addFolderButton" class="icon-button add-location" type="button" title="添加素材位置" data-hint="添加素材位置" aria-label="添加素材位置">+</button>
      </section>

      <main class="workspace">
        <div class="toolbar" role="toolbar" aria-label="素材工具栏">
          <div class="toolbar-left">
            <label id="inlineSearchField" class="search-field toolbar-inline-search" aria-label="搜索素材"><span class="ui-icon" data-icon="search" aria-hidden="true"></span><input id="searchInput" type="search" placeholder="搜索素材…" autocomplete="off" /><button id="clearSearchButton" class="clear-search" type="button" title="清除搜索" aria-label="清除搜索">&#215;</button></label>
            <button id="favoriteOnlyButton" class="tool-button icon-tool" type="button" title="只看收藏" data-hint="只看收藏" aria-label="只看收藏" aria-pressed="false"><span class="icon-star" aria-hidden="true"></span></button>
            <button id="sortButton" class="tool-button icon-tool sort-trigger" type="button" title="排序" data-hint="排序" aria-label="排序" aria-haspopup="true" aria-expanded="false"><span class="icon-sort" aria-hidden="true"></span></button>
            <button id="filterButton" class="tool-button icon-tool" type="button" title="筛选" data-hint="筛选" aria-label="筛选" aria-haspopup="true" aria-expanded="false"><span class="icon-filter" aria-hidden="true"></span><span id="filterBadge" class="filter-badge" hidden>0</span></button>
          </div>
          <span class="toolbar-divider" role="separator" aria-orientation="vertical"></span>
          <div class="toolbar-right">
            <button id="viewModeButton" class="tool-button icon-tool" type="button" data-hint="切换列表 / 卡片" aria-label="切换列表或卡片模式"><span class="icon-view-grid" aria-hidden="true"></span></button>
            <button id="listModeButton" class="tool-button icon-tool" type="button" data-hint="列表视图" aria-label="切换到列表视图"><span class="icon-view-list" aria-hidden="true"></span></button>
            <button id="cardStyleButton" class="tool-button icon-tool" type="button" data-hint="切换信息卡 / 纯净卡" aria-label="切换信息卡或纯净卡模式" aria-pressed="false"><span class="icon-card-style" aria-hidden="true"></span></button>
            <label id="zoomControl" class="zoom-control" title="缩略图大小">
              <span class="icon-thumb-small" aria-hidden="true"></span>
              <input id="zoomRange" type="range" min="150" max="260" step="10" value="190" aria-label="缩略图大小" />
              <span class="icon-thumb-large" aria-hidden="true"></span>
            </label>
            <button id="toolbarExportButton" class="tool-button icon-tool" type="button" data-hint="导出素材" aria-label="导出素材"><span class="ui-icon" data-icon="download" aria-hidden="true"></span></button>
          </div>
        </div>

        <div id="sortPopover" class="popover sort-popover" hidden>
          <div class="popover-heading"><strong>排序</strong></div>
          <label class="field-label"><span class="sr-only">排序依据</span>
            <select id="sortSelect">
              <option value="modified">修改日期</option>
              <option value="name">文件名</option>
              <option value="size">文件大小</option>
              <option value="type">文件类型</option>
              <option value="duration">时长</option>
            </select>
          </label>
          <button id="sortDirectionButton" class="menu-action sort-direction-action" type="button">降序</button>
        </div>

        <div class="filter-row" role="group" aria-label="素材类型">
          <button class="filter-button is-active" type="button" data-filter="all">全部</button>
          <button class="filter-button" type="button" data-filter="video">视频</button>
          <button class="filter-button" type="button" data-filter="image">图片</button>
          <button class="filter-button" type="button" data-filter="audio">音频</button>
          <button class="filter-button" type="button" data-filter="lut">LUT</button>
          <span id="resultCount" class="result-count">0 项</span>
          <button id="packageProjectButton" class="tool-button package-action" type="button" data-hint="打包当前 Premiere 项目实际使用的素材" aria-label="打包当前项目素材"><span class="icon-package" aria-hidden="true"></span><span>打包</span></button>
          <button id="clearSelectionButton" class="tool-button clear-selection-action" type="button" title="清除选择" aria-label="清除选择" hidden><span class="ui-icon" data-icon="x" aria-hidden="true"></span></button>
          <button id="resultActionsButton" class="result-actions-button" type="button" aria-label="更多素材操作" aria-haspopup="true" aria-expanded="false">&#9662;</button>
          <button id="selectAllButton" class="select-all-toggle" type="button" data-hint="勾选当前素材" aria-label="勾选当前素材" aria-pressed="false"><span class="icon-select-all" aria-hidden="true"></span></button>
        </div>

        <section class="library-pane" aria-label="素材浏览">
          <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
          <div id="operationProgress" class="operation-progress" role="status" aria-live="polite" hidden><span id="operationProgressLabel"></span><div><i id="operationProgressBar"></i></div></div>
          <div id="folderScopeBar" class="folder-scope-bar" hidden>
            <button id="folderBackButton" class="folder-scope-back" type="button" title="返回上一级" aria-label="返回上一级">返回</button>
          </div>
          <section id="assetGrid" class="asset-grid grid-medium" aria-label="素材列表"></section>

          <section id="emptyState" class="empty-state" hidden>
            <div class="empty-symbol">fn</div>
            <strong id="emptyTitle">没有找到素材</strong>
            <p id="emptyMessage">换一个关键词，或添加其他素材位置。</p>
          </section>
        </section>
        <aside id="previewDock" class="preview-dock" hidden aria-label="素材预览和信息">
          <div class="preview-dock-heading"><strong>预览</strong><button id="previewDockOpenButton" class="icon-button" type="button" title="打开完整预览" aria-label="打开完整预览"><span class="ui-icon" data-icon="maximize" aria-hidden="true"></span></button></div>
          <div id="previewDockMedia" class="preview-dock-media"><span class="preview-dock-empty">选择素材查看预览</span></div>
          <div class="preview-dock-title"><strong id="previewDockTitle"></strong><span id="previewDockSubtitle"></span></div>
          <div class="preview-dock-progress"><i id="previewDockProgress"></i></div>
          <div class="preview-dock-controls"><button id="previewDockBackButton" class="icon-button" type="button" title="上一素材" aria-label="上一素材"><span class="ui-icon" data-icon="skip-back" aria-hidden="true"></span></button><button id="previewDockPlayButton" class="icon-button preview-dock-play" type="button" title="打开预览" aria-label="打开预览"><span class="ui-icon" data-icon="play" aria-hidden="true"></span></button><button id="previewDockForwardButton" class="icon-button" type="button" title="下一素材" aria-label="下一素材"><span class="ui-icon" data-icon="skip-forward" aria-hidden="true"></span></button><span id="previewDockTime">--:-- / --:--</span><span class="preview-dock-spacer"></span><span class="ui-icon" data-icon="volume" aria-hidden="true"></span></div>
          <section class="preview-dock-info"><strong>文件信息</strong><dl id="previewDockInfoList"></dl></section>
        </aside>
      </main>

      <span id="statusText" class="sr-only" role="status" aria-live="polite">准备就绪</span>
    </div>

    <div id="locationsPopover" class="popover locations-popover" hidden>
      <div class="popover-heading locations-popover-actions"><div class="locations-heading-actions"><button id="locationsBackButton" class="icon-button" type="button" title="返回上一层" aria-label="返回上一层" hidden><span class="icon-up" aria-hidden="true"></span></button><strong class="sr-only">素材来源列表</strong></div><div class="locations-heading-actions"><button id="toggleAllRootsButton" class="text-button" type="button">全选</button><button id="closeLocationsPopover" class="icon-button" type="button" title="关闭" aria-label="关闭素材来源">&#215;</button></div></div>
      <p class="popover-hint">勾选一组或多组位置；未勾选时不显示素材。</p>
      <div id="locationsList" class="locations-list"></div>
      <div class="location-actions"><button id="addFolderFromPopover" class="menu-action" type="button">+ 添加素材位置</button></div>
    </div>

    <div id="resultActionsPopover" class="popover result-actions-popover" hidden>
      <button id="createFolderFromResultsButton" class="menu-action" type="button">新建文件夹</button>
      <button id="uploadFilesButton" class="menu-action" type="button">上传文件</button>
      <button id="pasteAssetsFromResultsButton" class="menu-action" type="button" disabled>粘贴</button>
      <button id="prepareOfflineButton" class="menu-action" type="button"><span class="ui-icon" data-icon="download" aria-hidden="true"></span>准备离线预览</button>
      <button id="clearPreviewCacheButton" class="menu-action" type="button">清理闲置预览缓存</button>
      <button id="diagnosticsButton" class="menu-action" type="button">版本与运行信息</button>
    </div>

    <section id="offlinePreviewPane" class="offline-preview-pane" role="dialog" aria-modal="true" aria-labelledby="offlinePreviewTitle" hidden>
      <header class="offline-heading"><h2 id="offlinePreviewTitle">准备离线预览</h2><button id="offlineCloseButton" class="icon-button" type="button" title="关闭离线预览任务" aria-label="关闭离线预览任务"><span class="ui-icon" data-icon="x" aria-hidden="true"></span></button></header>
      <div class="offline-content">
        <fieldset id="offlineSettings" class="offline-settings">
          <label class="offline-field">素材范围<select id="offlineScope"><option value="selected">选中项</option><option value="folder">当前插件文件夹</option><option value="roots">已启用的素材位置</option></select></label>
          <div class="offline-products" role="group" aria-label="缓存内容">
            <label class="check-row"><input id="offlineMetadata" type="checkbox" checked />元数据</label>
            <label class="check-row"><input id="offlinePoster" type="checkbox" checked />静态海报</label>
            <label class="check-row"><input id="offlineSprites" type="checkbox" />悬停雪碧图</label>
            <div class="offline-proxy-row"><label class="check-row"><input id="offlineProxies" type="checkbox" />播放代理</label><select id="offlineQuality" aria-label="播放代理分辨率" disabled><option value="540">540p</option><option value="720">720p</option></select></div>
          </div>
          <label class="check-row offline-pin"><input id="offlinePin" type="checkbox" checked />保留离线缓存</label>
          <button id="offlineUnpinButton" class="text-button" type="button" title="取消所选范围的离线保留标记，不删除任何文件">取消所选范围的缓存保留</button>
          <label class="offline-field">性能模式<select id="offlinePerformance"><option value="low">低占用</option><option value="balanced">均衡</option></select></label>
          <label class="offline-field" for="offlineCacheRoot">本机缓存目录</label>
          <div class="offline-directory"><input id="offlineCacheRoot" type="text" readonly aria-label="本机缓存目录" /><button id="offlineChooseRootButton" class="icon-button" type="button" title="选择本机缓存目录" aria-label="选择本机缓存目录"><span class="icon-folder" aria-hidden="true"></span></button></div>
          <label class="offline-field offline-budget">空间上限<span><input id="offlineBudget" type="number" min="2" max="128" step="1" value="12" aria-label="缓存空间上限 GiB" /> GiB</span></label>
        </fieldset>
        <div id="offlineEstimate" class="offline-estimate"></div>
        <section class="offline-job" aria-label="任务进度"><div class="offline-status-row"><strong id="offlineStatus">尚未开始</strong><span id="offlineCounts">0 / 0</span></div><progress id="offlineProgress" max="1" value="0" aria-label="离线预览任务进度"></progress><p id="offlineCurrentFile"></p><p id="offlineError" class="offline-error" role="alert" hidden></p><ul id="offlineFailures" class="offline-failures" hidden></ul></section>
      </div>
      <footer class="offline-actions"><button id="offlineStartButton" class="button button-primary" type="button"><span class="ui-icon" data-icon="play" aria-hidden="true"></span>开始准备</button><button id="offlinePauseButton" class="button button-secondary" type="button" hidden>暂停</button><button id="offlineResumeButton" class="button button-primary" type="button" hidden>继续</button><button id="offlineRetryButton" class="button button-secondary" type="button" hidden>重试失败项</button><button id="offlineCancelButton" class="button button-secondary" type="button" hidden>取消任务</button></footer>
    </section>

    <div id="toolbarSearchPopover" class="toolbar-search" hidden></div>

    <div id="filterPopover" class="popover filter-popover" hidden>
      <div class="popover-heading"><strong>筛选素材</strong><button id="resetFiltersButton" class="text-button" type="button">重置</button></div>
      <label class="field-label">文件大小
        <select id="sizeFilter"><option value="all">不限</option><option value="small">小于 100 MB</option><option value="medium">100 MB–1 GB</option><option value="large">大于 1 GB</option></select>
      </label>
      <label class="field-label">文件格式<input id="extensionFilter" type="text" placeholder="如 mp4, mov, wav" /></label>
      <label class="field-label">色彩标签
        <select id="labelFilter" class="sr-only"><option value="all">不限</option><option value="none">无标签</option><option value="red">红色</option><option value="orange">橙色</option><option value="yellow">黄色</option><option value="green">绿色</option><option value="blue">蓝色</option><option value="purple">紫色</option></select>
      </label>
      <div id="labelFilterChoices" class="label-filter-choices" role="group" aria-label="按色彩标签筛选"><button type="button" data-filter-label="all" class="is-active">全部</button><button type="button" data-filter-label="none"><i data-label="none"></i>无</button><button type="button" data-filter-label="red"><i data-label="red"></i>红</button><button type="button" data-filter-label="orange"><i data-label="orange"></i>橙</button><button type="button" data-filter-label="yellow"><i data-label="yellow"></i>黄</button><button type="button" data-filter-label="green"><i data-label="green"></i>绿</button><button type="button" data-filter-label="blue"><i data-label="blue"></i>蓝</button><button type="button" data-filter-label="purple"><i data-label="purple"></i>紫</button></div>
      <label class="field-label">素材位置<select id="rootFilter"><option value="all">全部位置</option></select></label>
      <label class="check-row"><input id="metadataOnlyFilter" type="checkbox" /> 只看已读取元数据的素材</label>
    </div>

    <div id="contextMenu" class="context-menu" role="menu" hidden>
      <button type="button" data-command="play">打开 <span>双击</span></button>
      <button type="button" data-command="import">导入项目</button>
      <div id="insertSubmenuRow" class="submenu-row"><button type="button">插入到 <span>&#8250;</span></button><div class="context-submenu"><button type="button" data-command="insert" data-position="current">当前时间</button><button type="button" data-command="insert" data-position="start">首帧</button><button type="button" data-command="insert" data-position="end">尾帧</button></div></div>
      <button id="contextAePlaceButton" type="button" data-command="insert" data-position="current" hidden>加入当前合成</button>
      <button class="info-command" type="button" data-command="info">文件信息</button>
      <div class="menu-separator"></div>
      <button id="copyAssetsButton" type="button" data-command="copy-assets">复制</button>
      <button id="cutAssetsButton" type="button" data-command="cut-assets">剪切</button>
      <button id="pasteAssetsButton" type="button" data-command="paste-assets" disabled>粘贴</button>
      <div class="menu-separator"></div>
      <button type="button" data-command="pin">置顶</button>
      <button type="button" data-command="favorite">收藏</button>
      <div id="transcodeMenu" class="submenu-row transcode-menu"><button type="button">文件转码 <span>&#8250;</span></button><div class="context-submenu"><button type="button" data-command="transcode" data-profile="1080">1080p</button><button type="button" data-command="transcode" data-profile="720">720p</button><button type="button" data-command="transcode" data-profile="360">360p</button></div></div>
      <div class="menu-separator"></div>
      <div class="label-menu"><span>色彩标签</span><div id="contextLabelChoices" class="label-choices"></div></div>
      <button id="copyLabelButton" type="button" data-command="copy-label">复制标签</button>
      <button id="pasteLabelButton" type="button" data-command="paste-label">粘贴标签</button>
      <button id="clearLabelButton" type="button" data-command="clear-label">清除标签</button>
      <div id="folderSubmenuRow" class="submenu-row"><button type="button">添加到文件夹 <span>&#8250;</span></button><div id="folderSubmenu" class="context-submenu"></div></div>
      <button type="button" data-command="duplicate">创建副本</button>
      <div class="menu-separator"></div>
      <button type="button" data-command="reveal">在 Finder 中显示</button>
      <button type="button" data-command="rename">重命名</button>
      <button class="danger-command" type="button" data-command="trash">移到废纸篓</button>
    </div>

    <section id="metadataPanel" class="overlay-panel metadata-panel" hidden aria-label="文件信息">
      <header class="overlay-header"><div><strong>文件信息</strong><span id="metadataTitle"></span></div><button id="closeMetadataButton" class="icon-button" type="button" aria-label="关闭文件信息">&#215;</button></header>
      <div id="metadataPreview" class="metadata-preview"></div>
      <div id="metadataLoading" class="metadata-loading">正在读取媒体元数据...</div>
      <dl id="metadataList" class="metadata-list"></dl>
    </section>

    <aside id="metadataHover" class="metadata-hover" hidden></aside>

    <section id="viewer" class="viewer" hidden aria-label="素材预览">
      <header class="viewer-header">
        <div class="viewer-title"><strong id="viewerTitle"></strong><span id="viewerSubtitle"></span></div>
        <div class="viewer-actions"><button id="closeViewerButton" class="icon-button viewer-close" type="button" aria-label="关闭预览">&#215;</button></div>
      </header>
      <div id="viewerStage" class="viewer-stage">
        <div id="viewerMediaLayer" class="viewer-media-layer"></div>
        <div id="viewerTimeline" class="viewer-timeline">
          <button id="viewerTimecode" class="viewer-timecode" type="button" title="切换时间码 / 帧数">00:00:00:00</button>
          <div id="timelineTrackWrap" class="timeline-track-wrap" title="点击定位；Shift+点击设置入点；Alt+点击设置出点；右键设置出点">
            <span id="viewerBuffered" class="viewer-buffered" aria-hidden="true"></span>
            <input id="viewerScrubber" class="viewer-scrubber" type="range" min="0" max="1000" step="1" value="0" aria-label="播放位置" />
            <span id="viewerInMark" class="timeline-mark timeline-mark-in" hidden>I</span>
            <span id="viewerOutMark" class="timeline-mark timeline-mark-out" hidden>O</span>
          </div>
          <div class="viewer-transport">
            <div class="transport-left">
              <button id="frameBackButton" class="viewer-icon-button" type="button" title="上一素材" aria-label="上一素材"><span class="icon-step-back" aria-hidden="true"></span></button>
              <button id="playPauseButton" class="viewer-icon-button viewer-play-button" type="button" title="播放" aria-label="播放"><span class="icon-play" aria-hidden="true"></span></button>
              <button id="frameForwardButton" class="viewer-icon-button" type="button" title="下一素材" aria-label="下一素材"><span class="icon-step-forward" aria-hidden="true"></span></button>
              <button id="loopButton" class="viewer-icon-button" type="button" title="循环播放 I/O" aria-label="循环播放入点到出点" aria-pressed="false"><span class="icon-loop" aria-hidden="true"></span></button>
            </div>
            <div class="transport-right">
              <div class="volume-control"><button id="volumeButton" class="viewer-icon-button" type="button" title="音量" aria-label="静音或恢复音量"><span class="icon-volume" aria-hidden="true"></span></button><input id="volumeRange" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量" /></div>
              <button id="screenshotButton" class="viewer-icon-button" type="button" title="截图入项目" aria-label="截图入项目"><span class="icon-camera" aria-hidden="true"></span></button>
              <div class="quality-control"><button id="qualityButton" class="viewer-icon-button quality-button" type="button" title="分辨率" aria-label="分辨率" aria-expanded="false">AUTO<span class="icon-chevron-down" aria-hidden="true"></span></button><div id="viewerQualityMenu" class="quality-menu" hidden><button type="button" data-quality="auto">AUTO</button><button type="button" data-quality="source">原始</button><button type="button" data-quality="4k">4K</button><button type="button" data-quality="1080">1080p</button><button type="button" data-quality="720">720p</button><button type="button" data-quality="540">540p</button><button type="button" data-quality="480">480p</button><button type="button" data-quality="360">360p</button></div></div>
              <div class="speed-control"><button id="speedButton" class="viewer-icon-button speed-button" type="button" title="播放速度" aria-label="播放速度" aria-expanded="false">1×<span class="icon-chevron-down" aria-hidden="true"></span></button><div id="viewerSpeedMenu" class="speed-menu" hidden><button type="button" data-speed="0.5">0.5×</button><button type="button" data-speed="0.75">0.75×</button><button type="button" data-speed="1">1×</button><button type="button" data-speed="1.25">1.25×</button><button type="button" data-speed="1.5">1.5×</button><button type="button" data-speed="2">2×</button></div></div>
            </div>
          </div>
        </div>
      </div>
      <div id="viewerBusy" class="viewer-busy" hidden>正在准备预览…</div>
      <span id="viewerMarks" class="sr-only">I — / O —</span>
    </section>

    <section id="lutViewer" class="viewer lut-viewer" hidden aria-label="LUT 预览">
      <header class="viewer-header"><div class="viewer-title"><strong id="lutViewerTitle"></strong><span id="lutViewerSubtitle">参考样片 · 近似预览</span></div><button id="closeLutViewerButton" class="icon-button viewer-close" type="button" aria-label="关闭 LUT 预览">&#215;</button></header>
      <div class="lut-stage"><div class="lut-canvas-wrap"><canvas id="lutCanvas" width="1024" height="576"></canvas><span class="lut-side-label lut-original-label">原图</span><span class="lut-side-label lut-result-label">LUT</span><span id="lutDivider" class="lut-divider" role="separator" aria-label="拖动分割线"></span></div></div>
      <div class="lut-controls"><div class="lut-compare-buttons" role="group" aria-label="LUT 对比模式"><button id="lutCompareToggle" class="button button-secondary is-active" type="button">切换对比</button><button id="lutSplitMode" class="button button-secondary" type="button">分割对比</button><button id="lutSliderMode" class="button button-secondary" type="button">滑动对比</button></div><label>分割位置 <input id="lutSplitRange" type="range" min="0" max="100" value="50" /></label><label>效果强度 <input id="lutOpacityRange" type="range" min="0" max="100" value="100" /></label><button id="installLutButton" class="button button-primary" type="button">应用到当前视频</button><span id="lutApplyStatus" class="lut-apply-status" role="status"></span></div>
    </section>

    <div id="fileActionDialog" class="dialog-backdrop" hidden>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <header><strong id="dialogTitle"></strong><p id="dialogMessage"></p></header>
        <label id="renameField" class="field-label" hidden>新文件名<input id="renameInput" type="text" /></label>
        <div class="dialog-actions"><button id="dialogCancelButton" class="button button-secondary" type="button">取消</button><button id="dialogConfirmButton" class="button button-primary" type="button">确认</button></div>
      </section>
    </div>

    <script src="js/CSInterface.js"></script>
    <script src="js/library.js"></script>
    <script src="js/media-tools.js"></script>
    <script src="js/offline-precache.js"></script>
    <script src="js/lut-tools.js"></script>
    <script src="js/timecode.js"></script>
    <script src="js/state-store.js"></script>
    <script src="js/plugin-folder-ops.js"></script>
    <script src="js/virtual-grid.js"></script>
    <script src="js/file-ops.js"></script>
    <script src="js/asset-ops.js"></script>
    <script src="js/project-packager.js"></script>
    <script src="js/interaction-tools.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
